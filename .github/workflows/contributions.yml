name: Daily Contribution Generator

on:
  schedule:
    - cron: '30 13 * * *' # Runs daily at 7:00 PM IST (13:30 UTC)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  make-contributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Make multiple commits
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # GitHub colors the contribution graph based on the number of commits on a given day,
          # not the size of the commit. To show the brightest green ('More' color), we perform multiple commits.
          # We select a random number of commits between 30 and 50.
          NUM_COMMITS=$(( ( RANDOM % 21 ) + 30 ))
          echo "Generating $NUM_COMMITS commits for today..."
          
          mkdir -p data
          for i in $(seq 1 $NUM_COMMITS); do
            echo "$(date -u): Contribution $i of $NUM_COMMITS" >> data/contributions.txt
            git add data/contributions.txt
            git commit -m "chore: daily contribution log $i/$NUM_COMMITS"
          done
          
          git push
