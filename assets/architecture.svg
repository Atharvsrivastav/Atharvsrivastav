<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#090e1f" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Node Glow Effects -->
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Connection Line Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#009688" />
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009688" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@600;800&amp;display=swap');

    .bg { fill: url(#bg-grad); }

    /* Blueprint grid background */
    .grid-line {
      stroke: #1E293B;
      stroke-width: 0.5px;
      opacity: 0.2;
    }

    /* Node Styles */
    .node-bg {
      fill: #0B0F19;
      stroke-width: 1px;
      transition: stroke 0.3s, fill 0.3s, filter 0.3s;
    }
    
    .node-group {
      cursor: pointer;
    }
    
    .node-group:hover .node-bg {
      fill: #131B2E;
      filter: drop-shadow(0 0 8px var(--node-color));
      stroke: var(--node-color);
      stroke-width: 1.5px;
    }
    
    .node-title {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      fill: #F8FAFC;
    }
    
    .node-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      font-weight: 700;
    }

    /* Set color variables for nodes */
    .n-client { --node-color: #3B82F6; }
    .n-gateway { --node-color: #009688; }
    .n-router { --node-color: #8B5CF6; }
    
    .n-resume { --node-color: #F43F5E; }
    .n-linkedin { --node-color: #EC4899; }
    .n-coach { --node-color: #D946EF; }
    .n-gap { --node-color: #A855F7; }
    
    .n-db { --node-color: #10B981; }
    .n-openai { --node-color: #0EA5E9; }

    /* Connection paths */
    .conn-path {
      fill: none;
      stroke: #1E293B;
      stroke-width: 1.5px;
      opacity: 0.5;
    }
    
    .conn-path.dashed {
      stroke-dasharray: 4, 4;
    }

    /* Flow Particles */
    .flow-dot {
      fill: none;
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-dasharray: 10, 140;
      animation: run-flow 5s infinite linear;
    }
    
    @keyframes run-flow {
      0% { stroke-dashoffset: 150; }
      100% { stroke-dashoffset: -150; }
    }

    #fd-client { stroke: #60A5FA; animation-duration: 3s; }
    #fd-gateway { stroke: #2DD4BF; animation-duration: 3s; }
    
    #fd-r1 { stroke: #F87171; animation-duration: 4s; }
    #fd-r2 { stroke: #F472B6; animation-duration: 4.2s; animation-delay: 0.5s; }
    #fd-r3 { stroke: #E879F9; animation-duration: 4.5s; animation-delay: 1s; }
    #fd-r4 { stroke: #C084FC; animation-duration: 4.8s; animation-delay: 1.5s; }

    #fd-a1-db { stroke: #34D399; animation-duration: 3.5s; }
    #fd-a1-ai { stroke: #38BDF8; animation-duration: 3.5s; animation-delay: 0.5s; }
    #fd-a2-db { stroke: #34D399; animation-duration: 3.8s; animation-delay: 0.2s; }
    #fd-a2-ai { stroke: #38BDF8; animation-duration: 3.8s; animation-delay: 0.7s; }
    #fd-a3-ai { stroke: #38BDF8; animation-duration: 4s; }
    #fd-a4-db { stroke: #34D399; animation-duration: 4.2s; }

    /* Top labels */
    .arch-label {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 800;
      fill: #475569;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Canvas -->
  <rect class="bg" width="800" height="320" rx="12" />

  <!-- Blueprint Grid Overlay -->
  <g>
    <line class="grid-line" x1="40" y1="0" x2="40" y2="320" />
    <line class="grid-line" x1="80" y1="0" x2="80" y2="320" />
    <line class="grid-line" x1="120" y1="0" x2="120" y2="320" />
    <line class="grid-line" x1="160" y1="0" x2="160" y2="320" />
    <line class="grid-line" x1="200" y1="0" x2="200" y2="320" />
    <line class="grid-line" x1="240" y1="0" x2="240" y2="320" />
    <line class="grid-line" x1="280" y1="0" x2="280" y2="320" />
    <line class="grid-line" x1="320" y1="0" x2="320" y2="320" />
    <line class="grid-line" x1="360" y1="0" x2="360" y2="320" />
    <line class="grid-line" x1="400" y1="0" x2="400" y2="320" />
    <line class="grid-line" x1="440" y1="0" x2="440" y2="320" />
    <line class="grid-line" x1="480" y1="0" x2="480" y2="320" />
    <line class="grid-line" x1="520" y1="0" x2="520" y2="320" />
    <line class="grid-line" x1="560" y1="0" x2="560" y2="320" />
    <line class="grid-line" x1="600" y1="0" x2="600" y2="320" />
    <line class="grid-line" x1="640" y1="0" x2="640" y2="320" />
    <line class="grid-line" x1="680" y1="0" x2="680" y2="320" />
    <line class="grid-line" x1="720" y1="0" x2="720" y2="320" />
    <line class="grid-line" x1="760" y1="0" x2="760" y2="320" />
    
    <line class="grid-line" x1="0" y1="40" x2="800" y2="40" />
    <line class="grid-line" x1="0" y1="80" x2="800" y2="80" />
    <line class="grid-line" x1="0" y1="120" x2="800" y2="120" />
    <line class="grid-line" x1="0" y1="160" x2="800" y2="160" />
    <line class="grid-line" x1="0" y1="200" x2="800" y2="200" />
    <line class="grid-line" x1="0" y1="240" x2="800" y2="240" />
    <line class="grid-line" x1="0" y1="280" x2="800" y2="280" />
  </g>

  <text class="arch-label" x="25" y="32">AI CAREER TWIN // SYSTEMS ARCHITECTURE</text>

  <!-- ==================== CONNECTORS ==================== -->
  
  <!-- Client to Gateway Connector -->
  <path class="conn-path" d="M 140,160 L 180,160" />
  <path id="fd-client" class="flow-dot" d="M 140,160 L 180,160" />

  <!-- Gateway to Router Connector -->
  <path class="conn-path" d="M 290,160 L 330,160" />
  <path id="fd-gateway" class="flow-dot" d="M 290,160 L 330,160" />

  <!-- Router to Agent 1 Connector -->
  <path class="conn-path" d="M 440,160 C 460,160 460,55 480,55" />
  <path id="fd-r1" class="flow-dot" d="M 440,160 C 460,160 460,55 480,55" />

  <!-- Router to Agent 2 Connector -->
  <path class="conn-path" d="M 440,160 C 460,160 460,120 480,120" />
  <path id="fd-r2" class="flow-dot" d="M 440,160 C 460,160 460,120 480,120" />

  <!-- Router to Agent 3 Connector -->
  <path class="conn-path" d="M 440,160 C 460,160 460,195 480,195" />
  <path id="fd-r3" class="flow-dot" d="M 440,160 C 460,160 460,195 480,195" />

  <!-- Router to Agent 4 Connector -->
  <path class="conn-path" d="M 440,160 C 460,160 460,260 480,260" />
  <path id="fd-r4" class="flow-dot" d="M 440,160 C 460,160 460,260 480,260" />

  <!-- Agents to DB and LLM Connectors -->
  <!-- Agent 1 (Resume) Connectors -->
  <path class="conn-path dashed" d="M 610,55 C 630,55 640,90 660,90" />
  <path id="fd-a1-db" class="flow-dot" d="M 610,55 C 630,55 640,90 660,90" />
  <path class="conn-path dashed" d="M 610,55 C 630,55 640,220 660,220" />
  <path id="fd-a1-ai" class="flow-dot" d="M 610,55 C 630,55 640,220 660,220" />

  <!-- Agent 2 (LinkedIn) Connectors -->
  <path class="conn-path dashed" d="M 610,120 C 630,120 640,90 660,90" />
  <path id="fd-a2-db" class="flow-dot" d="M 610,120 C 630,120 640,90 660,90" />
  <path class="conn-path dashed" d="M 610,120 C 630,120 640,220 660,220" />
  <path id="fd-a2-ai" class="flow-dot" d="M 610,120 C 630,120 640,220 660,220" />

  <!-- Agent 3 (Coach) Connectors -->
  <path class="conn-path dashed" d="M 610,195 C 630,195 640,220 660,220" />
  <path id="fd-a3-ai" class="flow-dot" d="M 610,195 C 630,195 640,220 660,220" />

  <!-- Agent 4 (Gap) Connectors -->
  <path class="conn-path dashed" d="M 610,260 C 630,260 640,90 660,90" />
  <path id="fd-a4-db" class="flow-dot" d="M 610,260 C 630,260 640,90 660,90" />
  <path class="conn-path dashed" d="M 610,260 C 630,260 640,220 660,220" />


  <!-- ==================== NODES ==================== -->

  <!-- Client Node -->
  <g class="node-group n-client" transform="translate(30, 125)">
    <rect class="node-bg" width="110" height="70" rx="8" stroke="#3B82F6" />
    <text class="node-title" x="15" y="32">CLIENT APP</text>
    <text class="node-subtitle" x="15" y="48" fill="#3B82F6">Next.js SaaS</text>
  </g>

  <!-- Gateway Node -->
  <g class="node-group n-gateway" transform="translate(180, 125)">
    <rect class="node-bg" width="110" height="70" rx="8" stroke="#009688" />
    <text class="node-title" x="15" y="32">API GATEWAY</text>
    <text class="node-subtitle" x="15" y="48" fill="#009688">FastAPI Backend</text>
  </g>

  <!-- Router Node -->
  <g class="node-group n-router" transform="translate(330, 125)">
    <rect class="node-bg" width="110" height="70" rx="8" stroke="#8B5CF6" />
    <text class="node-title" x="15" y="32">AGENT ROUTER</text>
    <text class="node-subtitle" x="15" y="48" fill="#8B5CF6">PydanticAI Engine</text>
  </g>

  <!-- Agent 1: Resume AI -->
  <g class="node-group n-resume" transform="translate(480, 30)">
    <rect class="node-bg" width="130" height="50" rx="6" stroke="#F43F5E" />
    <text class="node-title" x="15" y="24">RESUME AGENT</text>
    <text class="node-subtitle" x="15" y="38" fill="#F43F5E">Match &amp; Analyzer</text>
  </g>

  <!-- Agent 2: LinkedIn Eng -->
  <g class="node-group n-linkedin" transform="translate(480, 95)">
    <rect class="node-bg" width="130" height="50" rx="6" stroke="#EC4899" />
    <text class="node-title" x="15" y="24">LINKEDIN AGENT</text>
    <text class="node-subtitle" x="15" y="38" fill="#EC4899">Profile Optimizer</text>
  </g>

  <!-- Agent 3: Interview Coach -->
  <g class="node-group n-coach" transform="translate(480, 170)">
    <rect class="node-bg" width="130" height="50" rx="6" stroke="#D946EF" />
    <text class="node-title" x="15" y="24">INTERVIEW COACH</text>
    <text class="node-subtitle" x="15" y="38" fill="#D946EF">Mock Trainer</text>
  </g>

  <!-- Agent 4: Skill Gap -->
  <g class="node-group n-gap" transform="translate(480, 235)">
    <rect class="node-bg" width="130" height="50" rx="6" stroke="#A855F7" />
    <text class="node-title" x="15" y="24">GAP ANALYZER</text>
    <text class="node-subtitle" x="15" y="38" fill="#A855F7">Roadmap Planner</text>
  </g>

  <!-- Database Node -->
  <g class="node-group n-db" transform="translate(660, 60)">
    <rect class="node-bg" width="110" height="60" rx="8" stroke="#10B981" />
    <text class="node-title" x="15" y="26">VECTOR STORE</text>
    <text class="node-subtitle" x="15" y="42" fill="#10B981">PostgreSQL/pgvector</text>
  </g>

  <!-- LLM Node -->
  <g class="node-group n-openai" transform="translate(660, 190)">
    <rect class="node-bg" width="110" height="60" rx="8" stroke="#0EA5E9" />
    <text class="node-title" x="15" y="26">OPENAI API</text>
    <text class="node-subtitle" x="15" y="42" fill="#0EA5E9">GPT-4o Reasoning</text>
  </g>
</svg>
