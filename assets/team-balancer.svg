<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#090e1f" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Path Glows -->
    <linearGradient id="grad-engine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3ECF8E" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@600;800&amp;display=swap');

    .bg { fill: url(#bg-grad); }

    /* Blueprint grid */
    .grid-line {
      stroke: #1E293B;
      stroke-width: 0.5px;
      opacity: 0.2;
    }

    /* Card styling */
    .panel-bg {
      fill: #0B0F19;
      stroke: #1E293B;
      stroke-width: 1px;
      rx: 8px;
    }
    
    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      fill: #64748B;
      letter-spacing: 1px;
    }

    /* Player capsules */
    .player-card {
      fill: #131B2E;
      stroke: #1E293B;
      stroke-width: 1px;
      rx: 4px;
    }
    .player-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #94A3B8;
      font-weight: 700;
    }
    .player-rating {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      fill: #F59E0B;
      font-weight: 700;
    }

    /* Engine Node */
    .engine-core {
      fill: #1E293B;
      stroke: #10B981;
      stroke-width: 1.5px;
      animation: spin 8s infinite linear;
      transform-origin: 400px 120px;
    }
    .engine-text {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 800;
      fill: #F8FAFC;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Connection paths */
    .conn-path {
      fill: none;
      stroke: #1E293B;
      stroke-width: 1.5px;
      opacity: 0.5;
    }
    
    .flow-dot {
      fill: none;
      stroke-linecap: round;
      stroke-width: 2.5px;
      stroke-dasharray: 8, 100;
      animation: flow 4s infinite linear;
    }
    
    @keyframes flow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: -120; }
    }

    #fd-to-eng { stroke: #3B82F6; animation-duration: 3s; }
    #fd-team1 { stroke: #10B981; animation-duration: 3s; animation-delay: 0.5s; }
    #fd-team2 { stroke: #3ECF8E; animation-duration: 3.5s; animation-delay: 1s; }

    /* Floating layout */
    .float-group {
      animation: float 5s infinite alternate ease-in-out;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }
  </style>

  <!-- Background Layer -->
  <rect class="bg" width="800" height="240" rx="12" />

  <!-- Blueprint Grid Overlay -->
  <g>
    <line class="grid-line" x1="40" y1="0" x2="40" y2="240" />
    <line class="grid-line" x1="80" y1="0" x2="80" y2="240" />
    <line class="grid-line" x1="120" y1="0" x2="120" y2="240" />
    <line class="grid-line" x1="160" y1="0" x2="160" y2="240" />
    <line class="grid-line" x1="200" y1="0" x2="200" y2="240" />
    <line class="grid-line" x1="240" y1="0" x2="240" y2="240" />
    <line class="grid-line" x1="280" y1="0" x2="280" y2="240" />
    <line class="grid-line" x1="320" y1="0" x2="320" y2="240" />
    <line class="grid-line" x1="360" y1="0" x2="360" y2="240" />
    <line class="grid-line" x1="400" y1="0" x2="400" y2="240" />
    <line class="grid-line" x1="440" y1="0" x2="440" y2="240" />
    <line class="grid-line" x1="480" y1="0" x2="480" y2="240" />
    <line class="grid-line" x1="520" y1="0" x2="520" y2="240" />
    <line class="grid-line" x1="560" y1="0" x2="560" y2="240" />
    <line class="grid-line" x1="600" y1="0" x2="600" y2="240" />
    <line class="grid-line" x1="640" y1="0" x2="640" y2="240" />
    <line class="grid-line" x1="680" y1="0" x2="680" y2="240" />
    <line class="grid-line" x1="720" y1="0" x2="720" y2="240" />
    <line class="grid-line" x1="760" y1="0" x2="760" y2="240" />
    
    <line class="grid-line" x1="0" y1="40" x2="800" y2="40" />
    <line class="grid-line" x1="0" y1="80" x2="800" y2="80" />
    <line class="grid-line" x1="0" y1="120" x2="800" y2="120" />
    <line class="grid-line" x1="0" y1="160" x2="800" y2="160" />
    <line class="grid-line" x1="0" y1="200" x2="800" y2="200" />
  </g>

  <!-- ==================== FLOW CONNECTIONS ==================== -->
  <!-- Left Panel to Engine -->
  <path class="conn-path" d="M 210,120 L 330,120" />
  <path id="fd-to-eng" class="flow-dot" d="M 210,120 L 330,120" />

  <!-- Engine to Team A (Top Branch) -->
  <path class="conn-path" d="M 470,120 C 510,120 510,75 550,75" />
  <path id="fd-team1" class="flow-dot" d="M 470,120 C 510,120 510,75 550,75" />

  <!-- Engine to Team B (Bottom Branch) -->
  <path class="conn-path" d="M 470,120 C 510,120 510,165 550,165" />
  <path id="fd-team2" class="flow-dot" d="M 470,120 C 510,120 510,165 550,165" />

  <!-- ==================== LEFT PANEL: INPUT PLAYERS ==================== -->
  <g transform="translate(30, 25)">
    <rect class="panel-bg" width="180" height="190" />
    <text class="panel-title" x="15" y="22">UNSORTED ROSTER</text>
    
    <!-- Player 1 -->
    <g transform="translate(15, 38)">
      <rect class="player-card" width="150" height="30" />
      <text class="player-text" x="10" y="18">Atharv (Striker)</text>
      <text class="player-rating" x="115" y="18">★ 9.5</text>
    </g>
    <!-- Player 2 -->
    <g transform="translate(15, 75)">
      <rect class="player-card" width="150" height="30" />
      <text class="player-text" x="10" y="18">Player_A (Mid)</text>
      <text class="player-rating" x="115" y="18">★ 8.0</text>
    </g>
    <!-- Player 3 -->
    <g transform="translate(15, 112)">
      <rect class="player-card" width="150" height="30" />
      <text class="player-text" x="10" y="18">Player_B (Def)</text>
      <text class="player-rating" x="115" y="18">★ 7.5</text>
    </g>
    <!-- Player 4 -->
    <g transform="translate(15, 149)">
      <rect class="player-card" width="150" height="30" />
      <text class="player-text" x="10" y="18">Player_C (GK)</text>
      <text class="player-rating" x="115" y="18">★ 7.0</text>
    </g>
  </g>

  <!-- ==================== MIDDLE PANEL: BALANCING ENGINE ==================== -->
  <!-- Rotating Cog -->
  <g class="float-group">
    <!-- Outer Gear ring (represented by spokes/circles) -->
    <g class="engine-core">
      <circle cx="400" cy="120" r="40" fill="none" stroke="#3B82F6" stroke-width="6" stroke-dasharray="10,12" />
      <circle cx="400" cy="120" r="30" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="15,8" />
      <circle cx="400" cy="120" r="18" fill="#0B0F19" stroke="#3ECF8E" stroke-width="2" />
    </g>
    
    <!-- Engine Label Card -->
    <g transform="translate(330, 168)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#131B2E" stroke="#10B981" stroke-width="1" />
      <text class="engine-text" x="70" y="18">BALANCING ENGINE</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: BALANCED OUTPUTS ==================== -->
  <g transform="translate(590, 25)">
    <rect class="panel-bg" width="180" height="190" />
    <text class="panel-title" x="15" y="22">BALANCED ROSTERS</text>
    
    <!-- Team Alpha -->
    <g transform="translate(15, 38)">
      <rect class="player-card" width="150" height="60" stroke="#10B981" stroke-width="1" />
      <rect x="0" y="0" width="150" height="18" rx="2" fill="#10B981" fill-opacity="0.15" />
      <text class="player-text" x="10" y="13" fill="#10B981" font-weight="bold">TEAM ALPHA (Rating: 16.5)</text>
      
      <text class="player-text" x="10" y="34">Atharv (Striker)</text>
      <text class="player-rating" x="120" y="34">★ 9.5</text>
      <text class="player-text" x="10" y="50">Player_C (GK)</text>
      <text class="player-rating" x="120" y="50">★ 7.0</text>
    </g>

    <!-- Team Beta -->
    <g transform="translate(15, 112)">
      <rect class="player-card" width="150" height="60" stroke="#3ECF8E" stroke-width="1" />
      <rect x="0" y="0" width="150" height="18" rx="2" fill="#3ECF8E" fill-opacity="0.15" />
      <text class="player-text" x="10" y="13" fill="#3ECF8E" font-weight="bold">TEAM BETA (Rating: 15.5)</text>
      
      <text class="player-text" x="10" y="34">Player_A (Mid)</text>
      <text class="player-rating" x="120" y="34">★ 8.0</text>
      <text class="player-text" x="10" y="50">Player_B (Def)</text>
      <text class="player-rating" x="120" y="50">★ 7.5</text>
    </g>
  </g>
</svg>
