<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#090e1f" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Outfit:wght@600;800&amp;display=swap');

    .bg { fill: url(#bg-grad); }

    /* Bento Card Styling */
    .bento-card {
      fill: #0B0F19;
      stroke: #1E293B;
      stroke-width: 1px;
      rx: 8px;
      transition: stroke 0.3s ease, fill 0.3s ease;
    }
    
    .bento-card-group:hover .bento-card {
      stroke: #3B82F6;
      fill: #0F1626;
    }

    .bento-title {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      fill: #64748B;
      letter-spacing: 1px;
      transition: fill 0.3s ease;
    }
    
    .bento-card-group:hover .bento-title {
      fill: #93C5FD;
    }

    /* Badge Base Styling */
    .badge {
      cursor: pointer;
    }
    
    .badge rect {
      fill: #131B2E;
      stroke: #1E293B;
      stroke-width: 1px;
      rx: 4px;
      transition: stroke 0.2s ease, fill 0.2s ease, filter 0.2s ease;
    }
    
    .badge text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #94A3B8;
      transition: fill 0.2s ease;
    }

    /* Hover Colors and Shadows via CSS Variables */
    .badge:hover rect {
      fill: var(--hover-bg);
      stroke: var(--brand-color);
      stroke-width: 1.2px;
      filter: drop-shadow(0px 0px 5px var(--brand-color));
    }
    
    .badge:hover text {
      fill: #FFFFFF;
    }

    /* Define brand properties */
    .tech-ts { --brand-color: #3178C6; --hover-bg: rgba(49, 120, 198, 0.15); }
    .tech-py { --brand-color: #3776AB; --hover-bg: rgba(55, 118, 171, 0.15); }
    .tech-js { --brand-color: #F7DF1E; --hover-bg: rgba(247, 223, 30, 0.1); }
    .tech-c  { --brand-color: #61DAFB; --hover-bg: rgba(97, 218, 251, 0.15); }
    .tech-java { --brand-color: #ED8B00; --hover-bg: rgba(237, 139, 0, 0.15); }

    .tech-next { --brand-color: #E2E8F0; --hover-bg: rgba(255, 255, 255, 0.1); }
    .tech-react { --brand-color: #61DAFB; --hover-bg: rgba(97, 218, 251, 0.15); }
    .tech-tailwind { --brand-color: #06B6D4; --hover-bg: rgba(6, 182, 212, 0.15); }
    .tech-framer { --brand-color: #F43F5E; --hover-bg: rgba(244, 63, 94, 0.15); }
    .tech-gsap { --brand-color: #88CE02; --hover-bg: rgba(136, 206, 2, 0.15); }

    .tech-fastapi { --brand-color: #009688; --hover-bg: rgba(0, 150, 136, 0.15); }
    .tech-node { --brand-color: #339933; --hover-bg: rgba(51, 153, 51, 0.15); }
    .tech-supabase { --brand-color: #3ECF8E; --hover-bg: rgba(62, 207, 142, 0.15); }
    .tech-postgres { --brand-color: #4169E1; --hover-bg: rgba(65, 105, 225, 0.15); }
    .tech-firebase { --brand-color: #FFCA28; --hover-bg: rgba(255, 202, 40, 0.1); }

    .tech-openai { --brand-color: #10A37F; --hover-bg: rgba(16, 163, 127, 0.15); }
    .tech-langchain { --brand-color: #22C55E; --hover-bg: rgba(34, 197, 94, 0.15); }
    .tech-pydantic { --brand-color: #E92063; --hover-bg: rgba(233, 32, 99, 0.15); }
    .tech-pgvector { --brand-color: #38BDF8; --hover-bg: rgba(56, 189, 248, 0.15); }

    .tech-vercel { --brand-color: #E2E8F0; --hover-bg: rgba(255, 255, 255, 0.1); }
    .tech-cloudflare { --brand-color: #F38020; --hover-bg: rgba(243, 128, 32, 0.15); }
    .tech-git { --brand-color: #F05032; --hover-bg: rgba(240, 80, 50, 0.15); }
    .tech-github { --brand-color: #E2E8F0; --hover-bg: rgba(255, 255, 255, 0.1); }
    .tech-docker { --brand-color: #2496ED; --hover-bg: rgba(36, 150, 237, 0.15); }
  </style>

  <!-- Background Layer -->
  <rect class="bg" width="800" height="300" rx="12" />

  <!-- Bento Grid Column 1: Languages & Backend -->
  <!-- Languages -->
  <g class="bento-card-group" transform="translate(10, 10)">
    <rect class="bento-card" width="260" height="135" />
    <text class="bento-title" x="15" y="25">LANGUAGES</text>
    
    <!-- TypeScript -->
    <g class="badge tech-ts" transform="translate(15, 42)">
      <rect width="105" height="26" />
      <circle cx="15" cy="13" r="3" fill="#3178C6" />
      <text x="26" y="17">TypeScript</text>
    </g>
    <!-- Python -->
    <g class="badge tech-py" transform="translate(130, 42)">
      <rect width="80" height="26" />
      <circle cx="15" cy="13" r="3" fill="#3776AB" />
      <text x="26" y="17">Python</text>
    </g>
    <!-- C -->
    <g class="badge tech-c" transform="translate(217, 42)">
      <rect width="28" height="26" />
      <text x="9" y="17">C</text>
    </g>
    <!-- JavaScript -->
    <g class="badge tech-js" transform="translate(15, 82)">
      <rect width="105" height="26" />
      <circle cx="15" cy="13" r="3" fill="#F7DF1E" />
      <text x="26" y="17">JavaScript</text>
    </g>
    <!-- Java -->
    <g class="badge tech-java" transform="translate(130, 82)">
      <rect width="70" height="26" />
      <circle cx="15" cy="13" r="3" fill="#ED8B00" />
      <text x="26" y="17">Java</text>
    </g>
  </g>

  <!-- Backend & Database -->
  <g class="bento-card-group" transform="translate(10, 155)">
    <rect class="bento-card" width="260" height="135" />
    <text class="bento-title" x="15" y="25">BACKEND &amp; DATABASES</text>
    
    <!-- FastAPI -->
    <g class="badge tech-fastapi" transform="translate(15, 42)">
      <rect width="80" height="26" />
      <circle cx="15" cy="13" r="3" fill="#009688" />
      <text x="26" y="17">FastAPI</text>
    </g>
    <!-- Node.js -->
    <g class="badge tech-node" transform="translate(102, 42)">
      <rect width="80" height="26" />
      <circle cx="15" cy="13" r="3" fill="#339933" />
      <text x="26" y="17">Node.js</text>
    </g>
    <!-- Firebase -->
    <g class="badge tech-firebase" transform="translate(189, 42)">
      <rect width="56" height="26" />
      <text x="8" y="17">FB/Auth</text>
    </g>
    <!-- PostgreSQL -->
    <g class="badge tech-postgres" transform="translate(15, 82)">
      <rect width="110" height="26" />
      <circle cx="15" cy="13" r="3" fill="#4169E1" />
      <text x="26" y="17">PostgreSQL</text>
    </g>
    <!-- Supabase -->
    <g class="badge tech-supabase" transform="translate(132, 82)">
      <rect width="90" height="26" />
      <circle cx="15" cy="13" r="3" fill="#3ECF8E" />
      <text x="26" y="17">Supabase</text>
    </g>
  </g>

  <!-- Bento Grid Column 2: Frontend & DevOps -->
  <!-- Frontend & UI -->
  <g class="bento-card-group" transform="translate(280, 10)">
    <rect class="bento-card" width="260" height="135" />
    <text class="bento-title" x="15" y="25">FRONTEND &amp; UI</text>
    
    <!-- Next.js -->
    <g class="badge tech-next" transform="translate(15, 42)">
      <rect width="80" height="26" />
      <circle cx="15" cy="13" r="3" fill="#FFFFFF" />
      <text x="26" y="17">Next.js</text>
    </g>
    <!-- React -->
    <g class="badge tech-react" transform="translate(102, 42)">
      <rect width="75" height="26" />
      <circle cx="15" cy="13" r="3" fill="#61DAFB" />
      <text x="26" y="17">React</text>
    </g>
    <!-- GSAP -->
    <g class="badge tech-gsap" transform="translate(184, 42)">
      <rect width="60" height="26" />
      <circle cx="15" cy="13" r="3" fill="#88CE02" />
      <text x="26" y="17">GSAP</text>
    </g>
    <!-- Tailwind CSS -->
    <g class="badge tech-tailwind" transform="translate(15, 82)">
      <rect width="110" height="26" />
      <circle cx="15" cy="13" r="3" fill="#06B6D4" />
      <text x="26" y="17">TailwindCSS</text>
    </g>
    <!-- Framer Motion -->
    <g class="badge tech-framer" transform="translate(132, 82)">
      <rect width="112" height="26" />
      <circle cx="15" cy="13" r="3" fill="#F43F5E" />
      <text x="26" y="17">FramerMotion</text>
    </g>
  </g>

  <!-- DevOps & Tools -->
  <g class="bento-card-group" transform="translate(280, 155)">
    <rect class="bento-card" width="260" height="135" />
    <text class="bento-title" x="15" y="25">DEVOPS &amp; TOOLS</text>
    
    <!-- Vercel -->
    <g class="badge tech-vercel" transform="translate(15, 42)">
      <rect width="75" height="26" />
      <circle cx="15" cy="13" r="3" fill="#FFFFFF" />
      <text x="26" y="17">Vercel</text>
    </g>
    <!-- Cloudflare -->
    <g class="badge tech-cloudflare" transform="translate(97, 42)">
      <rect width="105" height="26" />
      <circle cx="15" cy="13" r="3" fill="#F38020" />
      <text x="26" y="17">Cloudflare</text>
    </g>
    <!-- Git -->
    <g class="badge tech-git" transform="translate(209, 42)">
      <rect width="36" height="26" />
      <text x="8" y="17">Git</text>
    </g>
    <!-- GitHub -->
    <g class="badge tech-github" transform="translate(15, 82)">
      <rect width="80" height="26" />
      <circle cx="15" cy="13" r="3" fill="#FFFFFF" />
      <text x="26" y="17">GitHub</text>
    </g>
    <!-- Docker -->
    <g class="badge tech-docker" transform="translate(102, 82)">
      <rect width="80" height="26" />
      <circle cx="15" cy="13" r="3" fill="#2496ED" />
      <text x="26" y="17">Docker</text>
    </g>
  </g>

  <!-- Bento Grid Column 3: AI & Machine Learning (Tall Bento Box) -->
  <g class="bento-card-group" transform="translate(550, 10)">
    <rect class="bento-card" width="240" height="280" />
    <text class="bento-title" x="15" y="25">AI &amp; AGENTIC SYSTEMS</text>

    <!-- OpenAI / LLMs -->
    <g class="badge tech-openai" transform="translate(20, 50)">
      <rect width="200" height="40" />
      <circle cx="20" cy="20" r="4.5" fill="#10A37F" />
      <text x="36" y="24" font-size="12">OpenAI API</text>
    </g>
    
    <!-- LangChain -->
    <g class="badge tech-langchain" transform="translate(20, 105)">
      <rect width="200" height="40" />
      <circle cx="20" cy="20" r="4.5" fill="#22C55E" />
      <text x="36" y="24" font-size="12">LangChain Framework</text>
    </g>

    <!-- PydanticAI -->
    <g class="badge tech-pydantic" transform="translate(20, 160)">
      <rect width="200" height="40" />
      <circle cx="20" cy="20" r="4.5" fill="#E92063" />
      <text x="36" y="24" font-size="12">PydanticAI</text>
    </g>

    <!-- pgvector -->
    <g class="badge tech-pgvector" transform="translate(20, 215)">
      <rect width="200" height="40" />
      <circle cx="20" cy="20" r="4.5" fill="#38BDF8" />
      <text x="36" y="24" font-size="12">pgvector / RAG</text>
    </g>
  </g>
</svg>
